{% extends "base.html" %}
{% block title %}Categories · SpendSense{% endblock %}
{% block content %}
<section class="page-head"><div><h1>Categories</h1><p>See how your expenses are grouped.</p></div></section>
<div class="category-cards">
{% for cat, value in categories.items() %}
  <a class="category-card" href="/invoices?category={{ cat|urlencode }}">
    <div class="category-dot"></div>
    <div><h3>{{ cat }}</h3><p>Click to view matching invoices</p></div>
    <strong>{{ value|money(2) }} →</strong>
  </a>
{% endfor %}
</div>
{% endblock %}
